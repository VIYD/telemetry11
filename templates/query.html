{% extends "base.html" %}

{% block title %}Metrics Dashboard{% endblock %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<style>
  .filters {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filters .metric-field {
    flex: 1 1 100%;
    min-width: 240px;
  }
  .filters input, .filters select, .filters button {
    padding: 8px;
    border: 1px solid #bbb;
    border-radius: 3px;
    font-size: 14px;
  }
  .filters select {
    background-color: #fff;
    color: #111;
    min-height: 34px;
  }
  /* .filters input[type="text"] {
    width: 100%;
  } */
  .filters button {
    background: #2d6ea3;
    color: #fff;
    cursor: pointer;
    min-width: 100px;
  }
</style>
{% endblock %}

{% block content %}
<h2 style="margin-top: 0;">Query</h2>

<form method="get" class="filters">
  <input class="metric-field" type="text" name="metric" list="metric-suggestions" value="{{ metric or '' }}" placeholder="metric selector">
  <datalist id="metric-suggestions"></datalist>
  <select id="mode" name="mode" title="Range selection mode">
    <option value="relative" {% if mode != 'absolute' %}selected{% endif %}>Relative</option>
    <option value="absolute" {% if mode == 'absolute' %}selected{% endif %}>Absolute</option>
  </select>
  <input id="duration" type="text" name="duration" value="{{ duration or (minutes|string + 'm') }}" placeholder="15m or 2h" title="Relative window size (m or h)">
  <input id="start" type="datetime-local" name="start" value="{{ start or '' }}" title="Absolute mode start time">
  <input id="end" type="datetime-local" name="end" value="{{ end or '' }}" title="Absolute mode end time">
  <input id="tz_offset_minutes" type="hidden" name="tz_offset_minutes" value="{{ tz_offset_minutes if tz_offset_minutes is not none else '' }}">
  <select name="timezone" title="Timestamp display timezone">
    <option value="browser" {% if timezone_mode != 'utc' %}selected{% endif %}>Browser timezone</option>
    <option value="utc" {% if timezone_mode == 'utc' %}selected{% endif %}>UTC</option>
  </select>
  <button type="submit">Query</button>
</form>

{% if query_error %}
<div style="margin-bottom: 12px; color: #a33;">{{ query_error }}</div>
{% endif %}

{% if data %}
<canvas id="chart" width="900" height="400"></canvas>
<script>
  const payload = {{ data | tojson }};
  const timezoneMode = {{ timezone_mode | tojson }};

  const modeControl = document.getElementById('mode');
  const durationInput = document.getElementById('duration');
  const startInput = document.getElementById('start');
  const endInput = document.getElementById('end');
  const tzOffsetInput = document.getElementById('tz_offset_minutes');

  function applyMode() {
    const isAbsolute = modeControl && modeControl.value === 'absolute';
    if (durationInput) durationInput.disabled = isAbsolute;
    if (startInput) startInput.disabled = !isAbsolute;
    if (endInput) endInput.disabled = !isAbsolute;
  }

  if (modeControl) {
    modeControl.addEventListener('change', applyMode);
    applyMode();
  }

  if (tzOffsetInput) {
    tzOffsetInput.value = String(new Date().getTimezoneOffset());
  }

  function formatTime(valueMs) {
    const options = {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    };
    if (timezoneMode === 'utc') {
      options.timeZone = 'UTC';
      options.timeZoneName = 'short';
    }
    return new Intl.DateTimeFormat(undefined, options).format(new Date(valueMs));
  }

  const maxGapMs = 2 * 60 * 1000;

  new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      datasets: payload.series.map(s => ({
        label: s.name + ' (' + payload.window_minutes + ' min window)',
        data: s.points,
        parsing: false,
        borderWidth: 2,
        pointRadius: 2,
        spanGaps: maxGapMs
      }))
    },
    options: {
      plugins: {
        tooltip: {
          callbacks: {
            title(items) {
              if (!items || !items.length) return '';
              return formatTime(items[0].parsed.x);
            }
          }
        }
      },
      scales: {
        x: {
          type: 'time',
          min: payload.start,
          max: payload.end,
          ticks: {
            callback(value) {
              const numeric = Number(value);
              if (Number.isFinite(numeric)) return formatTime(numeric);
              return value;
            }
          }
        }
      }
    }
  });
</script>
{% endif %}

{% if not data %}
<script>
  (function () {
    const modeControl = document.getElementById('mode');
  const durationInput = document.getElementById('duration');
    const startInput = document.getElementById('start');
    const endInput = document.getElementById('end');
  const tzOffsetInput = document.getElementById('tz_offset_minutes');

    function applyMode() {
      const isAbsolute = modeControl && modeControl.value === 'absolute';
      if (durationInput) durationInput.disabled = isAbsolute;
      if (startInput) startInput.disabled = !isAbsolute;
      if (endInput) endInput.disabled = !isAbsolute;
    }

    if (modeControl) {
      modeControl.addEventListener('change', applyMode);
      applyMode();
    }

    if (tzOffsetInput) {
      tzOffsetInput.value = String(new Date().getTimezoneOffset());
    }
  })();
</script>
{% endif %}

<script>
  (function () {
    const listEl = document.getElementById('metric-suggestions');
    if (!listEl) return;

    function buildSelector(name, labels) {
      if (!labels || Object.keys(labels).length === 0) return name;
      const parts = Object.keys(labels).sort().map(key => `${key}="${labels[key]}"`);
      return `${name}{${parts.join(',')}}`;
    }

    fetch('/api/explorer')
      .then(resp => resp.ok ? resp.json() : Promise.reject(resp.status))
      .then(payload => {
        const metrics = Array.isArray(payload.metrics) ? payload.metrics : [];
        const seen = new Set();
        const fragment = document.createDocumentFragment();

        metrics.forEach(item => {
          if (!item || !item.name) return;
          if (!seen.has(item.name)) {
            seen.add(item.name);
            const option = document.createElement('option');
            option.value = item.name;
            fragment.appendChild(option);
          }

          // Do not include suggestions with labels as it gets messy
          // if (Array.isArray(item.label_samples)) {
          //   item.label_samples.forEach(sample => {
          //     const selector = buildSelector(item.name, sample);
          //     if (!seen.has(selector)) {
          //       seen.add(selector);
          //       const option = document.createElement('option');
          //       option.value = selector;
          //       fragment.appendChild(option);
          //     }
          //   });
          // }
        });

        listEl.appendChild(fragment);
      })
      .catch(() => {});
  })();
</script>
{% endblock %}
